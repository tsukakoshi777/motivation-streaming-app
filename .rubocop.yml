plugins:
  - rubocop-rails

AllCops:
  NewCops: enable
  Exclude:
    - 'bin/**/*'
    - 'db/**/*'
    - 'config/**/*'
    - 'node_modules/**/*'
    - 'vendor/**/*'
    - 'tmp/**/*'
    - 'log/**/*'

# 日本語コメントを許可
Style/AsciiComments:
  Enabled: false

# クラスのコメントを不要にする
Style/Documentation:
  Enabled: false

# 長い行を許可
Layout/LineLength:
  Max: 120

# ブロックの行数制限を緩和
Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - 'config/environments/*'

# 日本語メッセージを許可
Rails/I18nLocaleTexts:
  Enabled: false

# メソッドの長さを緩和
Metrics/MethodLength:
  Max: 30

# クラスの長さを緩和
Metrics/ClassLength:
  Max: 250

# ABC サイズを緩和
Metrics/AbcSize:
  Max: 45

# Safe Navigation の長さを緩和
Style/SafeNavigationChainLength:
  Max: 4

# アクションフィルターの警告を無効化
Rails/LexicallyScopedActionFilter:
  Enabled: false