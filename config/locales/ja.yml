      require_login: 'ログインしてください'

  header:
    goals_index: '成長⭐一覧'
    profile: 'プロフィール'
    dashboard: '銀河系REPORT'

  static_pages:
    top:
      description_html: |
        配信でのもやもやな結晶☁(想い)を<br>
        成長の星⭐(目標)に変換するツール
      # ヒーローセクション
      hero:
        title_html: | 
          配信を続けたい！<br class="d-md-none">
          でも自分には難しい？
        cta_button: "もやもや結晶☁を調査🔍"
        note: "※googleログインですぐに利用可能"
      
      # 悩みセクション
      problems:
        title: "配信の悩みはきらめく星へ"
        subtitle: "Star Streaming Support"
        description_html: |
          配信のモチベーション維持に悩んでいる方を<br>サポートするサイトです。<br>
          あなたの配信の「悩み」を具体的な成長目標に変換します。
        # 悩み1
        problem1:
          title: "視聴者が増えない☁"
          description: "どうすれば視聴者を増やせるのか具体的なアドバイスが欲しい"
        
        # 悩み2
        problem2:
          title: "ファンが増えない☁"
          description: "どうやってファン化を促すのか知りたい"
        
        # 悩み3
        problem3:
          title: "改善点が分からない☁"
          description: "自身が目指す配信への不足している点を具体的に把握したい"

      # CTAセクション1
      cta1:
        title_html: |
          まずは気軽にもやもやした気持ちを<br>解消しませんか?
        description: "AIがあなたの配信状況や気持ちに寄り添い、具体的な改善提案をお届けします。"
        button: "もやもや結晶☁を調査🔍"
      
      # 3つの理由セクション
      reasons:
        title_html: |
          配信者の「続けたい」を叶える<br>6つのポイント
        
        # 理由1
        reason1:
          title_html: '<span class="text-primary fw-bold">「何を相談すればいいか」</span><br class="d-md-none d-lg-inline">
          がわかる'
          description_html: |
            一般的なAIは自由度が高い反面、
            <strong>「どう質問すればいいかわからない」</strong>という壁があります。<br>
            <br>
            <strong class="text-primary">推しスタなら、</strong><br>
            もやもや分析シートで質問を構造化し、悩みを言語化しやすくします。
            <strong>「何を相談すればいいかわからない」方にもおすすめです。</strong>
        
        # 理由2
        reason2:
          title_html: '<span class="text-primary fw-bold">配信者特化のAI分析</span><br class="d-md-none d-lg-inline">
          で目標を提案'
          description_html: |
            一般的なAIは汎用的なアドバイスになりがちで
            <strong>配信者に合わせた回答がもらえない。</strong><br>
            <br>
            <strong class="text-primary">推しスタなら、</strong><br>
            配信者特有の悩み(視聴者数、収益化、モチベーション維持など)に特化した分析基準を持ちます。
            <strong>「どこを」「どう」改善すればいいのか具体的に提案します。</strong>
        
        # 理由3
        reason3:
          title_html: '<span class="text-primary fw-bold">過去の記録を活用</span><br>して成長を実感'
          description_html: |
            <strong>目標への行動記録は毎日しなくてＯＫ、</strong>いつでも気軽に利用できます<br>
            <br>
            <strong class="text-primary">推しスタなら、</strong><br>
            過去の目標を保存し、モチベーションが下がったときに見返せます。
            <strong>「なぜモチベーションが低下したのか」を明確にし、同じ失敗を繰り返さないようサポートします。</strong>
        
        # 解決後のイメージ
        solution_title_html: |
          <span class="text-primary">推しスタ</span> は「その場限りの相談相手」ではなく<br>
          <span class="text-primary title12-parts">「継続的な成長パートナー」</span>です
        
        # 解決策1
        solution1:
          title_html: '悩みの可視化と<br>解決手順の提示'
          description_html: |
            漠然とした悩みを具体的な課題として認識でき、その課題を解決するための手順・ツール・情報を自分で調べなくても得られます。<br>
            <strong>調べるのが苦手な人でも、適切な情報に迷わずたどり着けます。</strong>
          note: "※ サービスや人脈の提供機能は今後実装予定"
        
        # 解決策2
        solution2:
          title_html: '星が成長することで<br>楽しく努力が可能'
          description_html: |
            行動記録数に応じて星の輝きが増していき、成長を視覚的に実感できます。<br>
            <strong>輝き件数に応じた獲得バッジや、各成長の星(目標)別のグラフで、これまでの努力を振り返れます。</strong>
        
        # 解決策3
        solution3:
          title_html: '変化する目標に<br>柔軟に対応'
          description_html: |
            配信者の目標は変化し続けます。<br>
            「雑談配信で楽しみたい」→「収益化を目指したい」→「特定のゲームで有名になりたい」<br>
            <strong>その時々の目標に合わせた情報・ツール・人脈を提供し続けます。</strong>
          note: "※ サービスや人脈の提供機能は今後実装予定"

      # 使い方セクション
      steps:
        title: "たった3ステップで心のもやもや☁を次の目標へ⭐"
        
        # ステップ1
        step1:
          title: "簡単な質問に答える"
          description_html: |
            配信の状況や目標について、いくつかの質問に答えるだけ。
            所要時間は約3分です。

        # ステップ2
        step2:
          title: "AIが分析"
          description_html: |
            あなたの回答をAIが分析し、
            配信の課題や改善点を見つけ出します。
        
        # ステップ3
        step3:
          title: "AI提案を受け取る"
          description_html: |
            あなたに合った具体的な改善策と、
            実現可能な目標を提案します。
      
      # 輝き機能セクション
      sparkle:
        title: "✨ 輝き機能"
        description_html: |
          もやもや結晶の調査で成長の星を作成できたら、、、<br>
          <br>
          星の輝きを加えていきましょう<br>
          <br>
          成長の星(目標)に対する行った努力を記録したり、<br>
          SNSに投稿するとリスナーに不快感を与えてしまうような<br>
          ネガティブな気持ちを吐き出すことができます。
        demo_label_pc: "PC版"
        demo_label_mobile: "モバイル版"
      
      # 開発者の想いセクション
      developer:
        title: "開発者の想い"
        signature: "推しスタ開発者🌕"
        motto: "あなたが苦悩した先に手に入れた輝きは誰かの心を照らす光になる"
      
      # 最終CTAセクション
      final_cta:
        title: "さあ、あなたがなりたい推し⭐になろう"
        description_html: |
          もやもやした気持ちはあなたをもっと輝かせる目標⭐になる<br>
          推しスタがあなたの配信の可能性を引き出します。
        button: "もやもや結晶☁を調査🔍"
        note: "※ googleログインですぐに利用可能"
 
    contact:
      title: 'お問い合わせ'
    privacy:
      title: 'プライバシーポリシー'
    terms:
      title: '利用規約'

